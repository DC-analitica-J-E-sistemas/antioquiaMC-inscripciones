<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antioquia Metropolitan Cup — Partidos y posiciones</title>
<meta name="description" content="Programación, resultados y tabla de posiciones de la Antioquia Metropolitan Cup.">
<style>
  :root {
    --acento: #12b04a; --texto: #111; --gris: #5b6470; --linea: #dfe3e8;
    --fondo: #f5f7f6; --card: #fff; --rojo: #c0392b; --ambar: #b7791f; --fila: #f0f3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --texto: #f2f4f3; --gris: #9aa5b1; --linea: #2c3338; --fondo: #0f1311; --card: #181d1a; --acento: #2fd16a; --rojo: #ff7b6b; --ambar: #f0b84a; --fila: #1e2420; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.4; }
  header { background: #0b0b0b; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
  header img { height: 60px; width: auto; }
  header h1 { color: #fff; font-size: 1.1rem; margin: 0; font-weight: 700; }
  header p { color: #b8c2bc; margin: 2px 0 0; font-size: .85rem; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 14px 60px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; font: inherit; font-weight: 600; cursor: pointer; padding: 10px 8px; border-radius: 999px; border: 1px solid var(--linea); background: var(--card); color: var(--texto); }
  .tabs button.activo { background: var(--acento); border-color: var(--acento); color: #06210f; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filtros select, .filtros input { font: inherit; padding: 9px 10px; border: 1px solid var(--linea); border-radius: 8px; background: var(--card); color: var(--texto); flex: 1; min-width: 140px; }
  h2.dia { font-size: .95rem; margin: 18px 0 8px; color: var(--gris); } h2.dia::first-letter { text-transform: uppercase; }
  .partido { background: var(--card); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .78rem; color: var(--gris); }
  .meta b { color: var(--texto); }
  .cruce { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 6px; }
  .cruce .eq { font-weight: 650; }
  .cruce .eq.l { text-align: right; }
  .marcador { font-size: 1.3rem; font-weight: 800; min-width: 74px; text-align: center; padding: 2px 8px; border-radius: 8px; background: var(--fila); }
  .marcador.vs { font-size: .85rem; font-weight: 600; color: var(--gris); }
  .gana { color: var(--acento); }
  .estado { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .estado.aplazado, .estado.suspendido { color: var(--ambar); }
  .estado.wo { color: var(--rojo); }
  .tabla-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--linea); border-radius: 12px; margin-bottom: 16px; }
  .tabla-wrap h3 { margin: 0; padding: 10px 14px; font-size: .95rem; background: var(--fila); border-bottom: 1px solid var(--linea); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 8px 8px; text-align: center; border-bottom: 1px solid var(--linea); }
  th { font-size: .72rem; color: var(--gris); text-transform: uppercase; }
  td.eq, th.eq { text-align: left; }
  td.pts { font-weight: 800; color: var(--acento); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(-n+2) td:first-child { box-shadow: inset 3px 0 0 var(--acento); }
  .vacio { text-align: center; padding: 36px 12px; color: var(--gris); }
  .pie { text-align: center; color: var(--gris); font-size: .8rem; margin-top: 18px; }
  footer { text-align: center; padding: 10px 16px 36px; color: var(--gris); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="img/torneo.png" alt="Antioquia Metropolitan Cup" onerror="this.style.display='none'">
  <div><h1>Antioquia Metropolitan Cup</h1><p>Programación, resultados y posiciones</p></div>
</header>
<main>
  <div class="tabs" id="tabs">
    <button type="button" data-v="prog" class="activo">Programación</button>
    <button type="button" data-v="res">Resultados</button>
    <button type="button" data-v="pos">Posiciones</button>
  </div>
  <div class="filtros">
    <select id="fCat" aria-label="Categoría"></select>
    <select id="fGrupo" aria-label="Grupo"></select>
    <select id="fDia" aria-label="Día"></select>
    <input id="fTexto" type="search" placeholder="Buscar equipo, cancha…" aria-label="Buscar" autocomplete="off">
  </div>
  <div id="contenido"><div class="vacio">Cargando…</div></div>
  <p class="pie" id="pie"></p>
</main>
<footer>Organiza: DC analítica J&amp;E sistemas</footer>

<script>
// =====================================================================
// CONFIGURACIÓN — la misma clave pública (sb_publishable_...) del formulario
// =====================================================================
const SUPABASE_URL = "https://bromcqhjewakfqokeytb.supabase.co";
const SUPABASE_KEY = "sb_publishable_4JPe8F2TewAOi4OlNsu1kQ_nEpz9rCy";
const REFRESCAR_SEG = 60;       // se actualiza sola cada minuto
// =====================================================================
const $ = (id) => document.getElementById(id);
const D = { par: [], pos: [] };
let vista = 'prog';

// Todo lo que viene de la base de datos se escapa antes de pintarlo.
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (t) => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cmp = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'es', { numeric: true, sensitivity: 'base' });
const JUGADO = (p) => p.estado === 'jugado' || p.estado === 'wo';

async function leer(vistaSql, orden) {
  const salida = [], paso = 1000;
  for (let desde = 0; ; desde += paso) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${vistaSql}?select=*&order=${orden}`, {
      headers: { apikey: SUPABASE_KEY, Range: `${desde}-${desde + paso - 1}`, 'Range-Unit': 'items' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const filas = await r.json(); salida.push(...filas);
    if (filas.length < paso) return salida;
  }
}
async function cargar() {
  try {
    const [par, pos] = await Promise.all([leer('v_programacion_publica', 'id'), leer('v_tabla_posiciones', 'categoria,fase,grupo,posicion')]);
    D.par = par; D.pos = pos; llenarFiltros(); render();
    $('pie').textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit' }) + ' · se actualiza solo cada minuto';
  } catch (e) {
    $('pie').textContent = ''; if (!D.par.length) $('contenido').innerHTML = '<div class="vacio">No se pudo cargar la información. Revisa tu conexión e intenta de nuevo.</div>';
  }
}

function opciones(sel, primera, valores, previo) {
  sel.innerHTML = `<option value="">${primera}</option>` + valores.map(([v, t]) => `<option value="${esc(v)}">${esc(t ?? v)}</option>`).join('');
  if (previo && valores.some(([v]) => v === previo)) sel.value = previo;
}
const diaTxt = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
function llenarFiltros() {
  const cats = [...new Set(D.par.map((p) => p.categoria))].sort(cmp);
  opciones($('fCat'), 'Todas las categorías', cats.map((c) => [c]), $('fCat').value);
  const cat = $('fCat').value;
  const gs = [...new Set(D.par.filter((p) => !cat || p.categoria === cat).map((p) => p.grupo).filter(Boolean))].sort(cmp);
  opciones($('fGrupo'), 'Todos los grupos', gs.map((g) => [g, 'Grupo ' + g]), $('fGrupo').value);
  const dias = [...new Set(D.par.map((p) => p.fecha).filter(Boolean))].sort();
  opciones($('fDia'), 'Todos los días', dias.map((d) => [d, diaTxt(d)]), $('fDia').value);
}

function filtrados() {
  const cat = $('fCat').value, g = $('fGrupo').value, d = $('fDia').value, t = norm($('fTexto').value);
  return D.par.filter((p) => (!cat || p.categoria === cat) && (!g || p.grupo === g) && (!d || p.fecha === d) &&
    (!t || norm([p.local, p.visitante, p.cancha, p.arbitro].join(' ')).includes(t)));
}
function tarjeta(p) {
  const j = JUGADO(p), gl = p.goles_local, gv = p.goles_visitante;
  const hora = p.hora ? p.hora.slice(0, 5) : 'Hora por definir';
  const centro = j ? `<div class="marcador"><span class="${gl > gv ? 'gana' : ''}">${gl}</span> - <span class="${gv > gl ? 'gana' : ''}">${gv}</span></div>` : '<div class="marcador vs">vs</div>';
  const estado = p.estado === 'programado' || p.estado === 'jugado' ? '' : `<span class="estado ${p.estado}">${{ aplazado: 'Aplazado', suspendido: 'Suspendido', wo: 'W.O.' }[p.estado]}</span>`;
  return `<div class="partido"><div class="meta"><span><b>${esc(hora)}</b>${p.cancha ? ' · ' + esc(p.cancha) : ''}${p.arbitro ? ' · Juez: ' + esc(p.arbitro) : ''}</span>
    <span>${esc(p.categoria)} · ${esc(p.fase)}${p.grupo ? ' ' + esc(p.grupo) : ''}${p.jornada ? ' · J' + p.jornada : ''} ${estado}</span></div>
    <div class="cruce"><div class="eq l">${esc(p.local)}</div>${centro}<div class="eq">${esc(p.visitante)}</div></div></div>`;
}
function listaPartidos(lista, conDias, vacioTxt) {
  if (!lista.length) return `<div class="vacio">${vacioTxt}</div>`;
  if (!conDias) return lista.map(tarjeta).join('');
  let dia = Symbol(), html = '';
  for (const p of lista) { const k = p.fecha || ''; if (k !== dia) { dia = k; html += `<h2 class="dia">${k ? esc(diaTxt(k)) : 'Fecha por definir'}</h2>`; } html += tarjeta(p); }
  return html;
}
function tablaPosiciones() {
  const cat = $('fCat').value, g = $('fGrupo').value;
  const filas = D.pos.filter((r) => (!cat || r.categoria === cat) && (!g || r.grupo === g));
  if (!filas.length) return '<div class="vacio">Las posiciones aparecerán cuando se programen los partidos.</div>';
  const grupos = new Map();
  for (const r of filas) { const k = [r.categoria, r.fase, r.grupo ?? ''].join('|'); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); }
  return [...grupos.values()].map((rs) => {
    const r0 = rs[0];
    return `<div class="tabla-wrap"><h3>${esc(r0.categoria)} · ${esc(r0.fase)}${r0.grupo ? ' · Grupo ' + esc(r0.grupo) : ''}</h3>
      <table><thead><tr><th>#</th><th class="eq">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>
      ${rs.map((r) => `<tr><td>${r.posicion}</td><td class="eq">${esc(r.equipo)}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="pts">${r.puntos}</td></tr>`).join('')}
      </tbody></table></div>`;
  }).join('') + '<p class="pie">Puntos: victoria 3, empate 1. Desempate: diferencia de gol, goles a favor y menos goles en contra.</p>';
}
function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('activo', b.dataset.v === vista));
  $('fDia').hidden = vista === 'pos';
  const f = filtrados();
  const orden = (a, b) => (a.fecha ?? '9999').localeCompare(b.fecha ?? '9999') || (a.hora ?? '99').localeCompare(b.hora ?? '99') || cmp(a.cancha, b.cancha) || a.id - b.id;
  if (vista === 'prog') $('contenido').innerHTML = listaPartidos(f.filter((p) => !JUGADO(p)).sort(orden), true, 'No hay partidos pendientes con esos filtros.');
  else if (vista === 'res') $('contenido').innerHTML = listaPartidos(f.filter(JUGADO).sort((a, b) => orden(b, a)), true, 'Todavía no hay resultados con esos filtros.');
  else $('contenido').innerHTML = tablaPosiciones();
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { vista = b.dataset.v; render(); } });
$('fCat').addEventListener('change', () => { $('fGrupo').value = ''; llenarFiltros(); render(); });
['fGrupo', 'fDia'].forEach((id) => $(id).addEventListener('change', render));
$('fTexto').addEventListener('input', render);

cargar(); setInterval(() => { if (!document.hidden) cargar(); }, REFRESCAR_SEG * 1000);
</script>
</body>
</html>
